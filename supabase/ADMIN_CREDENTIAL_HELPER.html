<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>iDepth 26 - Gerar Secrets Admin</title>
<style>
body{font-family:system-ui;background:#080a10;color:#fff;max-width:760px;margin:40px auto;padding:20px}
input,button,textarea{width:100%;box-sizing:border-box;margin:8px 0;padding:13px;border-radius:10px;border:1px solid #333;background:#111722;color:#fff}
button{background:#7137b9;cursor:pointer;font-weight:700}
textarea{height:220px}
small{color:#aab2c0}
</style>
<h1>iDepth 26 — Secrets do Admin</h1>
<p>Este arquivo roda somente no seu navegador. CPF e senha não são enviados para nenhum servidor.</p>
<input id="login" placeholder="CPF do administrador" inputmode="numeric">
<input id="pass" placeholder="Senha do administrador" type="password">
<button onclick="go()">Gerar secrets</button>
<textarea id="out" readonly placeholder="Os valores aparecerão aqui"></textarea>
<small>Depois de salvar os secrets no Supabase, feche esta página. Não compartilhe a senha nem os valores privados.</small>
<script>
const enc = new TextEncoder();
function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function b64url(bytes){let s=''; for(const b of bytes)s+=String.fromCharCode(b); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64(bytes){let s=''; for(const b of bytes)s+=String.fromCharCode(b); return btoa(s)}
async function go(){
  const login=document.getElementById('login').value.replace(/\D/g,'');
  const pass=document.getElementById('pass').value;
  if(!login||!pass){alert('Preencha CPF e senha.');return}
  const loginHash=hex(await crypto.subtle.digest('SHA-256',enc.encode(login)));
  const salt=crypto.getRandomValues(new Uint8Array(24));
  const key=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:210000},key,256);
  const session=crypto.getRandomValues(new Uint8Array(48));
  document.getElementById('out').value=
`ADMIN_LOGIN_SHA256=${loginHash}
ADMIN_PASSWORD_SALT=${b64(salt)}
ADMIN_PASSWORD_PBKDF2=${b64url(new Uint8Array(bits))}
ADMIN_SESSION_SECRET=${b64url(session)}`;
}
</script>
</html>
